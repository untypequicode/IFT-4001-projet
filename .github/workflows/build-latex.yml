name: Build LaTeX Document

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/proposition/**'
      - '.github/workflows/build-latex.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docs/proposition/**'
      - '.github/workflows/build-latex.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install just
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

    - name: Install LaTeX dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-lang-french

    - name: Build PDF with just
      working-directory: docs/proposition
      run: just build

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: proposition-pdf
        path: docs/proposition/main.pdf
        retention-days: 30

    - name: Upload PDF to release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: docs/proposition/main.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
